<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}组播硬件表演练台{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('web.dashboard') }}">
      <span class="brand-mark">⇉</span>
      <span>
        <strong>IPv4 组播硬件表演练台</strong>
        <small>本地试装 · 精确端口核对 · SQLite 已发布配置兜底</small>
      </span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('web.dashboard') }}"
         class="{{ 'active' if request.endpoint == 'web.dashboard' else '' }}">演练提交</a>
      <a href="{{ url_for('web.rules_page') }}"
         class="{{ 'active' if request.endpoint == 'web.rules_page' else '' }}">已装规则</a>
      <a href="{{ url_for('web.replay_page') }}"
         class="{{ 'active' if request.endpoint in ['web.replay_page'] else '' }}">回放 / 试发</a>
      <a href="{{ url_for('web.revisions_page') }}"
         class="{{ 'active' if request.endpoint in ['web.revisions_page', 'web.revision_detail'] else '' }}">版本记录</a>
    </nav>
  </div>
</header>

<main class="wrap content">
  {% block content %}{% endblock %}
</main>

<footer class="footer wrap">
  <span>Flask + SQLite 本地演练 · 硬件表项每条最多 2 个出端口，超出即交 CPU · 实际出端口须与监听表完全一致</span>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
